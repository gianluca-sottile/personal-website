<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message sent — Gianluca Sottile</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8B1A2D;
      --primary-light: #A52A3A;
      --bg: #fafbfc;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-muted: #5a5a6e;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(139,26,45,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .success-card {
      width: 100%;
      max-width: 700px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(139,26,45,0.08);
      color: var(--primary);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--primary);
      color: white;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--primary-light);
    }

    [data-lang] {
      display: none;
    }

    body.lang-it [data-lang="it"] {
      display: block;
    }

    body.lang-en [data-lang="en"] {
      display: block;
    }

    body.lang-it a[data-lang="it"],
    body.lang-en a[data-lang="en"] {
      display: inline-flex;
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>

    <h1 data-lang="it">Messaggio inviato</h1>
    <h1 data-lang="en">Message sent</h1>

    <p data-lang="it">
      Grazie per il tuo messaggio. Ti risponderò appena possibile.
    </p>
    <p data-lang="en">
      Thank you for your message. I will get back to you as soon as possible.
    </p>

    <a href="/" class="btn" data-lang="it">Torna alla homepage</a>
    <a href="/" class="btn" data-lang="en">Back to homepage</a>
  </div>

  <script>
    (function () {
      var savedLang = localStorage.getItem('preferredLang') || 'it';
      document.body.classList.add('lang-' + savedLang);
      document.documentElement.lang = savedLang;
    })();
  </script>
</body>
</html>
